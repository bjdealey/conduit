name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch that has an open PR matches both triggers above, which would run this
# twice for one commit. `github.head_ref` (pull_request) and `github.ref_name`
# (push) are both the branch name, so the two land in the same group and the
# earlier run is cancelled. Branches without a PR still get CI from the push.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `globals.css` is a pre-compiled Tailwind artifact, so a utility class the
      # app uses but that file never emitted fails silently — it just renders as
      # nothing. This catches that before it ships.
      - name: Utility classes all resolve
        run: npm run check:classes

      - run: npm run typecheck:packages
      - run: npm test
      - run: npm run build
