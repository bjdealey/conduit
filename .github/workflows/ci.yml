name: CI

# Push only. A `pull_request` trigger as well would match the same commit twice
# on any branch with an open PR; deduping that with a concurrency group works,
# but leaves a cancelled check run against the head commit, which is enough to
# report the PR as unstable. Check runs attach to the commit SHA, so the
# push-triggered run still shows up on the PR — one run per commit, no
# cancellations. (main is excluded because deploy.yml covers it.)
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the runner in `runner/` executes its own TypeScript with no
          # build step, which needs Node's unflagged type stripping (22.18+). On 20
          # its end-to-end tests fail on the host rather than on the code — and the
          # one property that makes a runner image a file and a workspace instead of
          # a toolchain would never be exercised in CI at all.
          node-version: 22
          cache: npm
      - run: npm ci

      # `globals.css` is a pre-compiled Tailwind artifact, so a utility class the
      # app uses but that file never emitted fails silently — it just renders as
      # nothing. This catches that before it ships.
      - name: Utility classes all resolve
        run: npm run check:classes

      - run: npm run typecheck:packages
      # Its own project, because `typecheck:packages` keeps `types: []` to prove the
      # packages are host-free — the runner is the one artefact here that is a host.
      - run: npm run typecheck:runner
      - run: npm test
      - run: npm run build
