# Supabase project config. `project_id` is set by `supabase link`; the placeholder here
# is a local label only and carries no secret.
project_id = "conduit"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322
major_version = 15

# Edge Functions share the workspace TypeScript via the import map below.
# Reads are served by PostgREST; these functions are the orchestration/write surface.
#
# verify_jwt is OFF on every function. The gateway JWT check assumes a legacy anon/user
# JWT, which projects on the new API-key system (sb_publishable_/sb_secret_) reject, and
# the frontend has no Supabase Auth session to present yet. Instead:
#   - Write/admin functions (connectors, sync, health) guard themselves in code via
#     requireAdminOrService(), which requires the service-role key or an admin user.
#   - Read functions (capabilities, bots) return only non-secret domain data.
# TODO(supabase): once Supabase Auth is wired in the frontend, re-enable verify_jwt on the
# read functions and switch to a direct PostgREST read for bots.

[functions.connectors]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.capabilities]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.workflows]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.node-types]
verify_jwt = false
import_map = "./functions/import_map.json"

# The runner protocol. verify_jwt must stay off here for a different reason from the
# others: runners are not users and must never hold a user JWT. They present the shared
# RUNNER_TOKEN, which the function checks itself on every action.
[functions.runner]
verify_jwt = false
import_map = "./functions/import_map.json"

# Triggering a run executes work on your infrastructure, so the function guards itself
# with requireAdminOrService() — service-role key or an admin user.
[functions.runs]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.health]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.sync]
verify_jwt = false
import_map = "./functions/import_map.json"
